name: Assemble V8 source

on:
  push:
    paths:
      - '.bootstrap/webwarp.*.b64'
      - '.github/workflows/assemble-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble webwarp.py
        shell: bash
        run: |
          cat .bootstrap/webwarp.01.b64 \
              .bootstrap/webwarp.02.b64 \
              .bootstrap/webwarp.03.b64 \
              .bootstrap/webwarp.04.b64 \
              .bootstrap/webwarp.05.b64 \
            | base64 --decode | gzip --decompress > webwarp.py
          test "$(sha256sum webwarp.py | awk '{print $1}')" = "30f1020149e128f96cf24706e5a17d8ac0ff01b565ebbaf09a3dc402ecc19435"
          python3 -m py_compile webwarp.py
          chmod +x webwarp.py
      - name: Commit assembled source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webwarp.py
          git commit -m "Add V8 reconstruction source"
          git push
